[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
include-package-data = true

[project]
name = "rinpy"
dynamic = ["version"]
description = "Residue Interaction Network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zehra Sarica", email = "zehraacar559@gmail.com" },
    { name = "Zehra Sarica", email = "sarica16@itu.edu.tr" }
]
requires-python = ">=3.10,<3.14"

dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "pandas>=2.0,<3.0",
    "networkx>=3.4,<4.0",
    "matplotlib>=3.7,<4.0",
    "plotly>=5.18,<7.0",
    "seaborn>=0.13,<1.0",
    "openpyxl>=3.1,<4.0",
    "biopandas>=0.5.1,<0.6",
    "scikit-learn>=1.3,<2.0",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering"
]

[project.scripts]
rinpy = "rinpy.__main__:main"

[project.urls]
Homepage = "https://github.com/zehrasarica/rinpy"
Documentation = "https://github.com/zehrasarica/rinpy"
Source = "https://github.com/zehrasarica/rinpy"

[tool.setuptools.dynamic]
version = { attr = "rinpy.__version__" }

[tool.setuptools.package-data]
"rinpy" = [
    "calculation_options.json",
    "fonts/*.ttf"
]

[tool.setuptools.exclude-package-data]
"rinpy" = [
    "tests/*",
     "README.md"
]
"*" = ["*.pyc", "*.pyo", "__pycache__/*"]